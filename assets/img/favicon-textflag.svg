<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background Squircle Clip Path -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>

    <!-- Mesh Gradient Diffusion Filter -->
    <filter id="meshBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="55" />
    </filter>

    <!-- Subtle White Glyph Shadow -->
    <filter id="glyphGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- App Icon Base & Multi-Color Gradient Background -->
  <g clip-path="url(#squircleClip)">
    <!-- Base Color Foundation -->
    <rect width="512" height="512" fill="#329db5" />

    <!-- Blurred Color Blobs Emulating Fluid Mesh -->
    <g filter="url(#meshBlur)">
      <!-- Top-Left: Green -->
      <circle cx="50" cy="40" r="160" fill="#2eb859" />

      <!-- Top-Right: Vibrant Red / Coral -->
      <circle cx="460" cy="50" r="180" fill="#e03b42" />

      <!-- Center Ambient: Soft Teal Cyan -->
      <circle cx="240" cy="270" r="170" fill="#3aa9ba" />

      <!-- Bottom-Left: Purple / Magenta -->
      <circle cx="40" cy="470" r="175" fill="#8933b8" />

      <!-- Bottom-Right: Warm Amber / Golden Yellow -->
      <circle cx="460" cy="470" r="175" fill="#e8b931" />
    </g>
  </g>

  <!-- Foreground Glyph: Flag on a pole -->
  <g fill="#FFFFFF" filter="url(#glyphGlow)">
    <!-- Pole -->
    <rect x="142" y="128" width="32" height="256" rx="16" />

    <!-- Wavy Pennant -->
    <path d="M174 150
             C 222 122 260 122 302 150
             C 328 168 354 168 380 150
             L 380 238
             C 354 256 328 256 302 238
             C 260 210 222 210 174 238
             Z" />
  </g>
</svg>